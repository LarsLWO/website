<section class="song-player" aria-label="Lied anhören">
  <div class="song-player-heading">
    <p class="song-player-label">Zum Anhören</p>
    <button class="song-info-button" type="button" aria-label="Informationen zur Entstehung des Songs" aria-haspopup="dialog" aria-controls="song-info" data-song-info-open hidden><span aria-hidden="true">i</span></button>
  </div>
  <div class="song-player-controls">
    <audio controls preload="metadata" aria-label="{{ page.title | escape }} anhören">
      <source src="{{ page.audio | relative_url }}" type="audio/mpeg">
      Dein Browser unterstützt diesen Audioplayer nicht. <a href="{{ page.audio | relative_url }}">Song als MP3 öffnen</a>.
    </audio>
  </div>
  <dialog class="song-info-dialog" id="song-info" aria-labelledby="song-info-title" aria-describedby="song-info-credits">
    <div class="song-info-heading">
      <h2 id="song-info-title">Über diesen Song</h2>
      <form method="dialog"><button class="song-info-close" aria-label="Informationen schließen" autofocus>×</button></form>
    </div>
    <p id="song-info-credits">Text und musikalische Idee: Lars Wollny<br>Musikalische Umsetzung mithilfe KI-gestützter Dienste</p>
  </dialog>
  <noscript><p class="song-info-fallback">Text und musikalische Idee: Lars Wollny<br>Musikalische Umsetzung mithilfe KI-gestützter Dienste</p></noscript>
</section>
<script src="{{ '/assets/js/song-player.js' | relative_url }}" defer></script>
