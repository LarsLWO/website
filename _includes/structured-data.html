<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": {{ '/' | absolute_url | append: '#website' | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "name": {{ site.title | jsonify }},
      "inLanguage": "de-DE",
      "author": {"@id": {{ '/' | absolute_url | append: '#author' | jsonify }}}
    },
    {
      "@type": "Person",
      "@id": {{ '/' | absolute_url | append: '#author' | jsonify }},
      "name": {{ site.author | jsonify }},
      "url": {{ '/ueber-mich/' | absolute_url | jsonify }},
      "image": {{ site.author_image | absolute_url | jsonify }}
    },
    {
      "@type": "{% if page.nav == 'about' %}ProfilePage{% elsif page.url == '/stories/' %}CollectionPage{% else %}WebPage{% endif %}",
      "@id": {{ canonical_url | append: '#webpage' | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "name": {{ seo_title | jsonify }},
      "description": {{ seo_description | jsonify }},
      "inLanguage": "de-DE",
      "isPartOf": {"@id": {{ '/' | absolute_url | append: '#website' | jsonify }}}{% if page.nav == 'home' or page.nav == 'about' %},
      "primaryImageOfPage": {
        "@type": "ImageObject",
        "url": {{ site.author_image | absolute_url | jsonify }},
        "caption": "Lars Wollny"
      }{% endif %}{% if page.nav == 'about' %},
      "mainEntity": {"@id": {{ '/' | absolute_url | append: '#author' | jsonify }}}{% elsif page.collection == 'texts' %},
      "mainEntity": {"@id": {{ canonical_url | append: '#story' | jsonify }}}{% endif %}
    }{% if page.collection == 'texts' %},
    {
      "@type": "{% if page.text_type == 'Songtext' or page.text_type == 'Gedicht' %}CreativeWork{% else %}ShortStory{% endif %}",
      "@id": {{ canonical_url | append: '#story' | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "headline": {{ page.title | jsonify }},
      "description": {{ seo_description | jsonify }},
      "inLanguage": {{ page.text_lang | default: site.lang | jsonify }},
      "genre": {{ page.genre | jsonify }},
      "keywords": {{ page.tags | join: ', ' | jsonify }},
{% capture story_audio_json %}
  {% assign audio_separator = '' %}
  {% if page.tabs.size > 0 %}
    {% for tab in page.tabs %}
      {% assign audio_song = tab %}
      {% if forloop.first and tab.audio == nil %}{% assign audio_song = page %}{% endif %}
      {% if audio_song.audio %}
        {{ audio_separator }}{% include structured-audio.html song=audio_song title=tab.title %}
        {% assign audio_separator = ',' %}
      {% endif %}
    {% endfor %}
  {% elsif page.audio %}
    {% include structured-audio.html song=page title=page.title %}
  {% endif %}
{% endcapture %}
{% assign story_audio_json = story_audio_json | strip %}
{% if story_audio_json != empty %}      "audio": [{{ story_audio_json }}],
{% endif %}      "image": {{ seo_image | jsonify }},
      "author": {"@id": {{ '/' | absolute_url | append: '#author' | jsonify }}},
      "mainEntityOfPage": {"@id": {{ canonical_url | append: '#webpage' | jsonify }}}{% if page.date %},
      "datePublished": {{ page.date | date: '%Y-%m-%d' | jsonify }}{% endif %}
    }{% endif %}
  ]
}
</script>
