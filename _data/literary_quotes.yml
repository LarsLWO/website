- text: '„Nein. Du wartest darauf, dass ich aufhöre zu reden.“'
  title: Concordia
  url: /texts/short/concordia/

- text: '„Vielleicht einfach mal nicht so tun, als wäre alles in Ordnung.“'
  title: Concordia
  url: /texts/short/concordia/

- text: |-
    nur diese menschen
    die durch diesen tunnel hetzen
    als wären sie noch lebendig
  title: Tunnelmenschen
  url: /texts/poems/tunnelmenschen/

- text: |-
    und das flackern des lichts
    das nichts beleuchtet
    außer der eigenen vergeblichkeit
  title: Tunnelmenschen
  url: /texts/poems/tunnelmenschen/

- text: '„Aber manchmal machte der Schnee auch aus einem gewöhnlichen Dienstag einen Tag, an den man sich sein Leben lang erinnerte.“'
  title: Schneewartezeit
  url: /texts/short/schneewartezeit/

- text: '„Mein Mann und ich suchten lange nach einer größeren Wohnung und fanden schließlich eine, in der wir uns nach einem Jahr wieder scheiden ließen.“'
  title: Schneewartezeit
  url: /texts/short/schneewartezeit/

- text: '„Ein Gesäß. Es war beunruhigend. Nicht wegen seiner Größe, sondern wegen seines Tempos.“'
  title: Gesäßbewusstsein
  url: /texts/short/gesaessbewusstsein/

- text: '„Menschen sind doch wirklich die einzigen Lebewesen, die komplizierte Erklärungen brauchen, um etwas Dummes zu tun.“'
  title: Gesäßbewusstsein
  url: /texts/short/gesaessbewusstsein/
